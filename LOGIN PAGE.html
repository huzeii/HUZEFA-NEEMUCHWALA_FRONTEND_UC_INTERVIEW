<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>LOGIN PAGE</title>
</head>

<body>
    <style>
        body{
            margin: 0px;
        }
        .img {
            width: 600px;
            height: 810px;
        }

        * {
            border: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: #FFF8F5;
        }

        .container {
            display: flex;
            gap: 150px;
            font-family: Poppins;
        }

        .title {
            margin-top: 130px;
            margin-left: 30px;
            font-size: 24px;
            font-weight: 600;
        }

        .wel {
            font-size: 32px;
            font-weight: 700;
            font-style: bold;
            margin-left: 30px;
            margin-bottom: 0px;
        }

        .hi {
            margin: 0px;
        }

        .miss {
            font-size: 16px;
            font-style: regular;
            color: #4E453F;
            font-weight: 400;
            margin-left: 30px;
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .email {
            margin-top: 48px;
            margin-bottom: 0px;
            margin-left: 30px;
            color: #4E453F;
            font-weight: 600;
            font-size: 14px;
            font-style: SemiBold;
        }

        .username {
            margin-bottom: 0px;
            margin-left: 30px;
            width: 440px;
            height: 54px;
            background-color: #FFFFFF;
            border-radius: 10px;
        }

        .pass {
            margin-top: 10px;
            margin-bottom: 0px;
        }

        .forgot {
            margin-left: 250px;
            color: #A89081;
            font-style: SemiBold;
        }
        .check{
            margin-left: 30px;
            margin-top: 10px;
            margin-bottom: 0px;
            color:#FFFFFF;
            border-color:#D2C4BC;
            height: 20px;
            width: 20px;
        }
        .rem{
            color: #4E453F;
            font-size: 16px;
            font-weight: 400;
            font-style: regular;
            margin-bottom: 0px;

        }
        .login{
            margin-left: 30px;
            margin-top: 10px;
            width: 440px;
            background-color:#3A2A1F;
            height: 38px;
            color: white;
            cursor: pointer;
            border-radius: 10px;

        }
        .or{
            margin-left: 30px;
        }
        .google{
            width: 440px;
            height: 48px;
            border-radius: 10px;
            border:2px solid;
            border-color: #D2C4BC;
            background-color:#FFF8F5;
            margin-left: 30px;
        }
        .con{
            color:#1D1B1A ;
            font-style: SemiBold;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
                }
                .ac{
                    margin-top: 50px;
                    margin-left: 140px;
                    color:#4E453F;
                    font-size: 16px;
                    font-style: regular;
                }
                .sign{
                    font-weight: 700;
                    font-style: bold;
                }
    </style>
    <div class="container">
        <img src="left2.png" alt="coffee cup" class="img">
        <div>
            <p class="title">
                <img src="Icon.png" alt="cup">
                Central Perk Café
            </p>
            <p class="wel">
                Welcome Back!
                <br>
            <p class="miss"> We've missed you. Log in to your account to continue <br>
                your coffee journey
            </p>
            </p>
            <p class="email">Email address</p>
            <input type="text" name="user" id="user" class="username" placeholder="&nbsp;&nbsp;name@example.com">
            <p class="pass email">Password
                <span class="forgot">Forgot Password?</span>
            </p>
            <input type="password" name="pass" id="pass" class="username passw"
                placeholder="&nbsp;&nbsp;&nbsp;******************">
            <span class="material-symbols-outlined">
                visibility
            </span>
            <br>
           
            <p class="rem"><input type="checkbox" name="remember" id="rem" class="check">&nbsp;&nbsp;Remember for 30 days </p>
            <br>
            <button class="login">LOGIN</button>
            <img src="Social Login Separator.png" alt="OR" class="or">
       <br>
       <button class="google con"><i class="fa-brands fa-google" > </i> Continue With Google</button>
       <br>
       <p class="ac">Don't have an account?<span class="sign"> Sign Up</span></p>
        
        </div>

    </div>

</body>

</html>
